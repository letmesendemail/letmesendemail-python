[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letmesendemail"
version = "0.1.0"
description = "letmesend.email Python SDK."
license = { text = "MIT" }
homepage = "https://letmesend.email/"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]
keywords = ["letmesend", "email", "sdk", "api", "client"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.27.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/letmesendemail"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
