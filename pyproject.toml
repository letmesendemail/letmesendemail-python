[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letmesendemail"
version = "0.2.0"
description = "letmesend.email Python SDK."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
]
keywords = ["letmesend", "email", "sdk", "api", "client"]

[project.urls]
Homepage = "https://letmesend.email/"
Repository = "https://github.com/letmesendemail/letmesendemail-python"

# CI workflow: .github/workflows/test-python.yml

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.27.0,<0.37.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/letmesendemail"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
